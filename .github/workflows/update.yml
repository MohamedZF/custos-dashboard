name: Update dashboard

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]          # redeploy when the page or script changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy the page
        run: mkdir -p _site && cp -r site/. _site/ && rm -rf _site/data

      - name: Fetch the latest tag data from Field Signal
        # To add a tag, add a line to TAGS:  SIGFOX_ID=Name shown on the site
        env:
          FIELD_SIGNAL_PASSCODE: ${{ secrets.FIELD_SIGNAL_PASSCODE }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          OUT_DIR: _site/data
          TAGS: |
            3B4D874=Custos 11.5SAC
            3B4D876=Custos 11-4 SAC
            3A0C108=Custos 11.2BP
            3B4D868=Custos 11.1 SAC
        run: node scripts/update.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
